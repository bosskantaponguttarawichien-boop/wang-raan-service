# CI — ทุก PR และทุก push เข้า main ต้องผ่านครบก่อน merge
# คำสั่งในแต่ละขั้นเหมือนที่รันในเครื่อง (Makefile / npm scripts)
#
# @bosskantaponguttarawichien-boop/wang-raan-core อยู่บน GitHub Packages (publish จาก repo wang-raan):
# - ใช้ secret PACKAGES_READ_TOKEN (token ที่มีสิทธิ์ read:packages) ถ้าตั้งไว้
# - ไม่งั้นใช้ GITHUB_TOKEN — ต้องเปิดสิทธิ์ให้ repo นี้ที่ package settings → Manage Actions access ก่อน
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: read

# push ใหม่ใน branch เดิม → ยกเลิกรอบเก่า
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN || secrets.GITHUB_TOKEN }}

jobs:
  checks:
    name: Lint + Unit + Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@bosskantaponguttarawichien-boop"
      - run: npm ci
      - name: Harness (schema / dependencies ของ feature list)
        run: make status
      - name: Lint (ESLint + TypeScript + boundary + สัญญา API)
        run: make lint
      - name: Format
        run: npm run format
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build

  integration:
    name: Integration (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wang_raan_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d wang_raan_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      # ตั้งไว้แล้ว scripts/with-test-db.sh จะใช้ฐานข้อมูลนี้แทนการเปิด Docker เอง
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/wang_raan_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@bosskantaponguttarawichien-boop"
      - run: npm ci
      - name: Integration + contract tests
        run: npm run test:integration

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # image เดียวกับที่ Railway build (railway.json → Dockerfile) — token ส่งเป็น BuildKit secret ไม่ติดใน layer
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          secrets: NODE_AUTH_TOKEN=${{ env.NODE_AUTH_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
